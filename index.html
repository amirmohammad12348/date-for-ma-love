<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amir ❤️ Niousha</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#000,#8b0000);
font-family:tahoma;
overflow:hidden;
}

.box{
background:#111;
color:white;
width:90%;
max-width:400px;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 0 30px red;
}

.heart{
font-size:60px;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.3);}
}

h1{
color:#ff1744;
}

button{
border:0;
padding:14px 25px;
margin:8px;
border-radius:30px;
font-size:17px;
cursor:pointer;
}

.yes{
background:#ff1744;
color:white;
}

.no{
background:#333;
color:white;
}

#box2{
display:none;
}

#time,#result{
color:#ff6688;
font-weight:bold;
}

input{
padding:12px;
border-radius:10px;
}

</style>
</head>


<body>

<div class="box">

<div class="heart">❤️</div>

<h1>نیوشا جان</h1>

<h2 id="txt">
با من قرار میای؟ 😍
</h2>


<button class="yes" onclick="yes()">
آره ❤️
</button>

<button class="no" onclick="no()">
نه 😅
</button>


<div id="box2">

<h2>Good Girl ❤️</h2>

<p id="time"></p>

<p>
روز و ساعت قرارمون رو انتخاب کن 📅
</p>

<input type="datetime-local" id="date">

<br>

<button class="yes" onclick="save()">
ثبت قرار 💕
</button>

</div>


<div id="result"></div>


</div>



<script>

function no(){
alert("تو حق انتخاب گزینه نه رو نداری 😄❤️");
}


function yes(){

document.querySelector(".yes").style.display="none";
document.querySelector(".no").style.display="none";

document.getElementById("txt").innerHTML="Good Girl ❤️";

document.getElementById("box2").style.display="block";

heartRain();

}



function clock(){

let t=new Date().toLocaleTimeString("fa-IR",{
timeZone:"Asia/Tehran",
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
});

document.getElementById("time").innerHTML=
"🕒 ساعت ایران: "+t;

}

setInterval(clock,1000);
clock();



function heartRain(){

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.innerHTML="❤️";

h.style.position="fixed";
h.style.left=Math.random()*100+"%";
h.style.top="-20px";
h.style.fontSize="25px";
h.style.transition="3s";

document.body.appendChild(h);

setTimeout(()=>{
h.style.top="100%";
},100);

setTimeout(()=>{
h.remove();
},3000);

}

}



function save(){

let d=document.getElementById("date").value;


if(!d){
alert("اول تاریخ رو انتخاب کن ❤️");
return;
}


document.getElementById("result").innerHTML=

"❤️ ثبت شد نیوشا ❤️<br><br>"+
"📅 قرار: "+d+
"<br><br>"+
'<button class="yes" onclick="telegram()">ارسال به امیر 💙</button>';

}



function telegram(){

let d=document.getElementById("date").value;


let msg=
"❤️ قرار ثبت شد ❤️\n\n"+
"اسم: نیوشا\n"+
"📅 تاریخ و ساعت: "+d+
"\n\nمنتظرتم امیر 😍";


let link=
"https://t.me/mirmolakhah?text="
+encodeURIComponent(msg);


window.open(link,"_blank");

}

</script>

</body>
</html>
