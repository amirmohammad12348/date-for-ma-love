<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>امیر و نیوشا ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:tahoma;
overflow:hidden;
}

.box{
background:white;
padding:30px;
border-radius:25px;
text-align:center;
width:90%;
max-width:400px;
box-shadow:0 10px 30px #0003;
}

button{
border:0;
padding:15px 30px;
border-radius:30px;
font-size:18px;
margin:10px;
cursor:pointer;
}

.yes{
background:#e91e63;
color:white;
}

.no{
background:#ddd;
}

#calendar{
display:none;
}

#final{
color:#e91e63;
font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<h1>نیوشا جان ❤️</h1>

<h2 id="text">با من قرار میای؟ 😍</h2>

<button class="yes" onclick="yesClick()">آره ❤️</button>

<button class="no" onclick="noClick()">نه 😅</button>


<div id="calendar">

<h3>آفرین دختر خوب 😍❤️</h3>

<p>حالا روز قرارمون رو انتخاب کن 📅</p>

<input type="date" id="date">

<br>

<button class="yes" onclick="saveDate()">ثبت قرار 💕</button>

</div>


<p id="final"></p>

</div>


<script>

function noClick(){

alert("تو حق انتخاب گزینه نه رو نداری 😄❤️");

}


function yesClick(){

document.querySelector(".yes").style.display="none";
document.querySelector(".no").style.display="none";

document.getElementById("calendar").style.display="block";

document.getElementById("text").innerHTML=
"آفرین دختر خوب 😍❤️";

fireworks();

}


function fireworks(){

for(let i=0;i<50;i++){

let f=document.createElement("div");

f.innerHTML="🎉";

f.style.position="fixed";
f.style.left=Math.random()*100+"%";
f.style.top="-20px";
f.style.fontSize="30px";
f.style.transition="3s";

document.body.appendChild(f);

setTimeout(()=>{
f.style.top="100%";
},100);

setTimeout(()=>{
f.remove();
},3000);

}

}


function saveDate(){

let d=document.getElementById("date").value;

if(d==""){
alert("اول تاریخ رو انتخاب کن ❤️");
return;
}

document.getElementById("final").innerHTML=
"ثبت شد نیوشا ❤️<br>"+
"قرارمون در تاریخ: "+d+" 😍<br>"+
"امیر منتظرته 💕";

}

</script>

</body>
</html>
